name: app-release

on:
  push:
    branches: [main]
  # A manual run is a build preview. It never commits, tags, or publishes.
  # The preview still builds all four platforms.
  workflow_dispatch:

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.value }}
      release: ${{ steps.bump.outputs.release || 'true' }}
      bumped: ${{ steps.bump.outputs.bumped || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide and prepare one release version
        id: bump
        if: github.event_name == 'push'
        run: python3 scripts/auto_release.py maybe-bump-app --root "$GITHUB_WORKSPACE" --before "${{ github.event.before }}" --after "${{ github.sha }}"
      - name: Resolve prepared version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.bump.outputs.release != 'false'
        with:
          name: prepared-app-version
          retention-days: 1
          if-no-files-found: error
          path: |
            package.json
            package-lock.json

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
          - id: windows-x64
            runner: windows-2025
            platform: win
            arch: x64
          - id: macos-x64
            runner: macos-15-intel
            platform: mac
            arch: x64
          - id: macos-arm64
            runner: macos-15
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      EVERLOOK_EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
      ELECTRON_CACHE: ${{ github.workspace }}/../.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/../.cache/electron-builder
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prepared-app-version
          path: .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ github.workspace }}/../.cache/electron
            ${{ github.workspace }}/../.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm test
      - name: Typecheck and compile
        if: runner.os == 'Linux'
        run: npm run build
      - name: Compile without a second typecheck
        if: runner.os != 'Linux'
        run: npx --no-install electron-vite build && node scripts/verify-build.mjs
      - name: Package native architecture
        run: npx --no-install electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - if: runner.os == 'Linux'
        name: Package Omarchy and install headless smoke dependencies
        run: |
          npm run package:omarchy
          sudo apt-get update
          sudo apt-get install -y xvfb
          # Chromium refuses to start unless its SUID sandbox helper is owned by root with mode 4755.
          sudo chown root:root dist/linux-unpacked/chrome-sandbox
          sudo chmod 4755 dist/linux-unpacked/chrome-sandbox
      - name: Packaged startup, preload, and IPC smoke
        if: runner.os != 'Linux'
        run: node scripts/package-smoke.mjs dist
      - name: Packaged startup, preload, and IPC smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/package-smoke.mjs dist
      - name: Windows installed update smoke
        if: runner.os == 'Windows'
        run: node scripts/windows-update-smoke.mjs
      - name: Record native source, version, and architecture
        run: node scripts/write-build-receipt.mjs ${{ matrix.id }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.id }}
          retention-days: 1
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
            dist/*.exe
            dist/*.dmg
            dist/*.blockmap
            dist/latest*.yml
            dist/build-*.json

  verify:
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      AWS_ENDPOINT: ${{ secrets.AWS_ENDPOINT }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_USE_PATH_STYLE_ENDPOINT: ${{ secrets.AWS_USE_PATH_STYLE_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.APP_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.APP_AWS_SECRET_ACCESS_KEY }}
      APP_AWS_BUCKET: ${{ secrets.APP_AWS_BUCKET }}
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prepared-app-version
          path: .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci --omit=dev --ignore-scripts
      - name: Checksum the installers and publish a real release
        run: |
          set -euo pipefail
          args=(python3 scripts/release_artifacts.py release "$VERSION" --source-sha "${{ github.sha }}")
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            args+=(--publish)
          fi
          "${args[@]}"
      - name: Commit the prepared version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepare.outputs.bumped == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "chore: release app $VERSION"
          bash scripts/push_release_commit.sh
      - name: Tag and publish one GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          tag="app-v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists."
            exit 0
          fi
          python3 scripts/auto_release.py release-notes --product app --since "$BEFORE" > "$RUNNER_TEMP/app-notes.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "Everlook app $VERSION"
          git push origin "$tag"
          gh release create "$tag" release/*.AppImage release/*.deb release/*.zip release/*.exe release/*.dmg release/*.blockmap release/latest*.yml release/desktop-release.json release/build-*.json --verify-tag --title "Everlook app $VERSION" --notes-file "$RUNNER_TEMP/app-notes.md"
